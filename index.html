<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پاسور چهار نفره</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;background:#0b3d2b radial-gradient(circle at 50% 40%,#17694a,#0b3d2b 70%);color:#f6efd9}
button,input{font:inherit}
button{background:#e8c26a;color:#2a1d00;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.g{background:#ffffff22;color:#f6efd9}
input{padding:10px 12px;border-radius:10px;border:1px solid #e8c26a88;background:#00000033;color:#fff;width:100%}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:34px;font-weight:900;margin:24px 0 4px;color:#e8c26a}
.box{background:#00000030;border:1px solid #e8c26a44;border-radius:14px;padding:16px;margin:14px 0;display:grid;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.seat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff18}
.p{text-align:center;padding:6px 10px;border-radius:10px;font-size:14px;min-width:90px}
.p.on{background:#e8c26a;color:#2a1d00;font-weight:700}
.top{display:flex;justify-content:center;margin:8px 0}
.mid{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tb{flex:1;min-height:150px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;background:#00000026;border-radius:16px;padding:10px}
.hand{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.c{width:54px;height:78px;background:#fbf6e6;color:#1c1c1c;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1.1;box-shadow:0 2px 6px #0006;cursor:pointer;direction:ltr;user-select:none;transition:transform .12s}
.c i{font-style:normal;font-size:24px}
.c.red{color:#c1272d}
.c.sel{transform:translateY(-10px);outline:3px solid #e8c26a}
.msg{text-align:center;min-height:24px;font-size:15px;color:#e8c26a}
.act{text-align:center}
.res{text-align:center;font-size:18px;line-height:2}
.lm{text-align:center;font-size:14px;margin:4px 0;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.mc{display:inline-block;background:#fbf6e6;color:#1c1c1c;border-radius:5px;padding:1px 6px;font-weight:700;direction:ltr}
.mc.red{color:#c1272d}
.tb{position:relative}
.c.new{animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-36px) scale(1.1);opacity:0}to{transform:none;opacity:1}}
.gh{position:absolute;inset:0;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;pointer-events:none;animation:go 1.2s ease-in forwards}
.gh .c{width:36px;height:52px;font-size:15px;border-radius:6px;outline:2px solid #e8c26a}
.gh .c i{font-size:16px}
#chat.off{padding:4px 0;background:none;border:0;margin-top:8px}
@keyframes go{0%{opacity:0;transform:scale(1.15)}12%{opacity:1;transform:scale(1)}45%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}}
#chat{margin-top:14px;background:#00000030;border:1px solid #e8c26a44;border-radius:14px;padding:10px;display:grid;gap:8px}
#clog{max-height:90px;overflow:auto;font-size:14px;line-height:1.7}
#stk{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sb{padding:6px 10px;white-space:nowrap;font-size:18px;flex:none}
.crow{display:flex;gap:6px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid #e8c26a;padding:8px 18px;border-radius:18px;font-size:26px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.gh{display:none}.c.new{animation:none}}
</style>
</head>
<body>
<div class="wrap">
 <div id="home">
  <h1>پاسور چهار نفره</h1>
  <div style="opacity:.8">دو تیم دو نفره؛ اتاق بساز، کد یا لینک را بفرست، دوستانت وارد شوند.</div>
  <div class="box">
   <input id="name" placeholder="اسم شما" maxlength="14">
   <button id="cbtn" onclick="createRoom()">ساخت اتاق جدید</button>
  </div>
  <div class="box">
   <input id="code" placeholder="کد اتاق" maxlength="4" style="text-transform:uppercase;direction:ltr;text-align:center">
   <button class="g" id="jbtn" onclick="joinRoom()">ورود با کد</button><div id="js" style="color:#e8c26a;min-height:20px;font-size:14px"></div>
  </div>
 </div>
 <div id="app" hidden>
  <div class="bar"><span>کد اتاق: <b id="rc" style="font-size:20px;letter-spacing:3px"></b></span><button class="g" onclick="copyLink()">کپی لینک دعوت</button></div>
  <div id="main"></div>
  <div id="chat"><div class="bar"><span id="cn" style="display:none">🔇 چت توسط میزبان بسته شده</span><button id="ct" class="g" style="display:none" onclick="toggleChat()"></button></div><div id="clog"></div><div id="stk"></div><div class="crow" id="crow"><input id="cin" maxlength="120" placeholder="پیام…" onkeydown="if(event.key=='Enter')sendTxt()"><button onclick="sendTxt()">ارسال</button></div></div>
  <div id="toast"></div>
 </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const SU={S:'♠',H:'♥',D:'♦',C:'♣'};
const RL=r=>r==1?'A':r==11?'J':r==12?'Q':r==13?'K':r;
let peer,room,host,isHost=false,G=null,V=null,pc=-1,sel=[],myName='',allConns=[];
$('code').value=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,4);
if($('code').value){
  const nb=$('name').parentNode,cb=$('cbtn'),jb=$('jbtn'),iv=document.createElement('div');
  $('home').prepend(cb);cb.className='g';cb.style.cssText='padding:4px 10px;font-size:12px;margin-bottom:4px';
  iv.textContent='دعوت به اتاق '+$('code').value;iv.style.cssText='color:#e8c26a;font-weight:700';
  jb.className='';jb.textContent='ورود به بازی';nb.prepend(iv);nb.append(jb,$('js'));$('code').parentNode.style.display='none';
}

/* ---------- اتصال ---------- */
const esc=t=>String(t).replace(/[&<>"']/g,'');
const STK=['👏','😂','😡','🔥','🤝','😎','🙏','😭','🤔','💪','آفرین!','بد شانسی 😅','یالا زود باش','پاسور!'];
let tt,lastEv=0;
STK.forEach(e=>{const b=document.createElement('button');b.className='g sb';b.textContent=e;b.onclick=()=>sendChat(e,'s');$('stk').append(b)});
function setCO(off){$('stk').style.display=$('crow').style.display=off?'none':'';$('cn').style.display=off&&!isHost?'':'none';$('clog').style.display=off?'none':'';$('chat').classList.toggle('off',off);const b=$('ct');b.style.display=isHost?'':'none';b.textContent=off?'🔊 وصل کردن چت':'🔇 قطع چت'}
function toggleChat(){G.chatOff=!G.chatOff;V.chatOff=G.chatOff;allConns.forEach(cn=>{try{cn.send({t:'co',v:G.chatOff})}catch(e){}});setCO(G.chatOff)}
function sendTxt(){const i=$('cin');sendChat(i.value,'t');i.value=''}
function sendChat(m,k){m=String(m).trim();if(!m||!V||V.me<0||V.chatOff)return;if(isHost)bc(0,m,k);else host.send({t:'chat',m,k})}
function bc(s,m,k){allConns.forEach(cn=>{try{cn.send({t:'chat',s,m,k})}catch(e){}});showChat(s,m,k)}
function showChat(s,m,k){
  const n=(V&&V.names[s])||'؟',l=$('clog'),d=document.createElement('div'),b=document.createElement('b');
  b.textContent=n+': ';d.append(b,document.createTextNode(m));l.append(d);
  while(l.children.length>50)l.firstChild.remove();l.scrollTop=1e9;
  if(k=='s'){const t=$('toast');t.textContent=n+': '+m;t.className='show';clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)}
}
function stat(t){$('js').textContent=t}
function createRoom(){
  myName=esc($('name').value.trim())||'میزبان';
  const c=Math.random().toString(36).slice(2,6).toUpperCase();
  peer=new Peer('pasur-'+c);
  peer.on('open',()=>{isHost=true;room=c;G={phase:'lobby',names:[myName,null,null,null],conns:[null,null,null,null],bots:[0,0,0,0],target:0,total:[0,0],over:false};sendAll()});
  peer.on('connection',cn=>{allConns.push(cn);cn.on('data',d=>hostMsg(cn,d));cn.on('close',()=>{allConns=allConns.filter(x=>x!=cn);const i=G.conns.indexOf(cn);if(i>=0){if(G.phase=='lobby'){G.names[i]=null;G.conns[i]=null}else{G.bots[i]=1;G.msg='⚠️ '+G.names[i]+' قطع شد؛ ربات جایش بازی می‌کند';G.names[i]+=' 🤖'}sendAll()}})});
  peer.on('error',e=>{if(e.type=='unavailable-id')createRoom();else alert('خطا در اتصال: '+e.type)});
}
function joinRoom(){
  myName=esc($('name').value.trim())||'بازیکن';
  const c=$('code').value.trim().toUpperCase();if(!c)return alert('کد اتاق را بنویس');
  room=c;stat('در حال اتصال به سرور…');const t1=setTimeout(()=>stat('❌ به سرور اتصال (PeerJS) وصل نشد. اینترنت یا فیلترشکن را عوض کن و دوباره امتحان کن.'),12000);peer=new Peer();
  peer.on('open',()=>{clearTimeout(t1);stat('در حال اتصال به میزبان…');host=peer.connect('pasur-'+c,{reliable:true});const t2=setTimeout(()=>stat('❌ به میزبان وصل نشد. مطمئن شو میزبان صفحه را باز نگه داشته. اگر باز هم نشد، مشکل از شبکه است؛ با وای‌فای یا فیلترشکن دیگر امتحان کنید.'),15000);host.on('open',()=>clearTimeout(t2));
    host.on('open',()=>host.send({t:'hello'}));
    host.on('data',d=>{if(d.t=='view'){V=d.v;pc=-1;sel=[];render()}else if(d.t=='err')alert(d.m);else if(d.t=='chat')showChat(d.s,d.m,d.k);else if(d.t=='co'&&V){V.chatOff=d.v;setCO(d.v)}});
    host.on('close',()=>alert('اتصال با میزبان قطع شد'))});
  peer.on('error',e=>stat(e.type=='peer-unavailable'?'❌ اتاقی با این کد پیدا نشد':'❌ خطا: '+e.type));
}
function copyLink(){const u=location.origin+location.pathname+'?room='+room;navigator.clipboard.writeText(u).then(()=>alert('لینک کپی شد'),()=>prompt('لینک:',u))}

/* ---------- میزبان: منطق بازی ---------- */
function hostMsg(cn,d){
  if(d.t=='hello')sendAll();
  else if(d.t=='sit'&&G.phase=='lobby'&&d.seat>0&&d.seat<4&&!G.names[d.seat]){
    const o=G.conns.indexOf(cn);if(o>=0){G.names[o]=null;G.conns[o]=null}
    G.names[d.seat]=esc(d.name).slice(0,14);G.conns[d.seat]=cn;sendAll()}
  else if(d.t=='play'){const e=doPlay(G.conns.indexOf(cn),d.ci,d.sel);if(e)cn.send({t:'err',m:e})}
  else if(d.t=='chat'){const q=G.conns.indexOf(cn);if(q>=0&&!G.chatOff)bc(q,String(d.m).slice(0,120),d.k)}
}
function view(s){return{me:s,phase:G.phase,names:G.names,table:G.table||[],hand:s>=0&&G.hands?G.hands[s]:[],cnt:G.hands?G.hands.map(h=>h.length):[0,0,0,0],turn:G.turn,cc:G.cap?G.cap.map(a=>a.length):[0,0],sur:G.sur||[0,0],msg:G.msg||'',res:G.res,tm:G.team||[0,1,0,1],act:G.act||[0,1,2,3],ev:G.ev||null,chatOff:!!G.chatOff,target:G.target||0,total:G.total||[0,0]}}
function sendAll(){allConns.forEach(cn=>{const s=G.conns.indexOf(cn);try{cn.send({t:'view',v:view(s)})}catch(e){}});V=view(0);pc=-1;sel=[];render();clearTimeout(bt);if(G.phase=='play'&&G.bots[G.turn])bt=setTimeout(botPlay,1300)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deal(){G.hands=[0,1,2,3].map(i=>G.act.includes(i)?G.deck.splice(0,4).sort((a,b)=>a.r-b.r):[])}
function startGame(m){
  G.mode=m;if(G.phase=='lobby'||G.over){G.total=[0,0];G.over=false}if(m==2&&G.names.filter(x=>x).length!=2)return alert('برای بازی دو نفره دقیقاً دو نفر باید نشسته باشند');
  let d;do{d=[];for(const s of 'SHDC')for(let r=1;r<=13;r++)d.push({r,s});shuffle(d)}while(d.slice(0,4).some(c=>c.r==11));
  if(m!=2)for(let i=0;i<4;i++)if(!G.names[i]){G.names[i]='🤖 ربات '+(i+1);G.bots[i]=1}
  G.act=m==2?[0,1,2,3].filter(i=>G.names[i]):[0,1,2,3];G.team=[0,1,0,1];if(m==2){G.team=[0,0,0,0];G.team[G.act[1]]=1}
  G.deck=d;G.table=G.deck.splice(0,4);G.cap=[[],[]];G.sur=[0,0];if(G.phase=='lobby')G.st=G.act[0];else{let q=G.st;do{q=(q+1)%4}while(!G.act.includes(q));G.st=q}G.turn=G.st;G.last=0;G.phase='play';G.res=null;G.ev=null;deal();G.msg=G.names[G.st]+' شروع می‌کند';sendAll();
}
function canCap(c,T){
  if(c.r==11)return T.some(t=>t.r<12);
  if(c.r>11)return T.some(t=>t.r==c.r);
  const r=new Set([0]);T.filter(t=>t.r<=10).forEach(t=>{[...r].forEach(u=>{if(u+t.r<=11)r.add(u+t.r)})});
  return r.has(11-c.r);
}
function part(a){if(!a.length)return true;const[f,...r]=a,n=r.length;for(let m=0;m<1<<n;m++){let s=f;const rest=[];for(let i=0;i<n;i++)(m>>i&1)?s+=r[i]:rest.push(r[i]);if(s==11&&part(rest))return true}return false}
function doPlay(s,ci,si){
  if(G.phase!='play'||s!=G.turn)return 'نوبت شما نیست';
  const h=G.hands[s],c=h[ci];if(!c)return 'اول یک کارت از دستت انتخاب کن';
  const sl=[...new Set(si)].map(i=>G.table[i]).filter(Boolean);
  let cap=null;
  if(c.r==11){const x=G.table.filter(t=>t.r<12);if(x.length)cap=x}
  else if(c.r>11){if(sl.length==1&&sl[0].r==c.r)cap=sl;else if(sl.length)return 'شاه و بی‌بی فقط هم‌شکل خودشان را می‌برند'}
  else if(sl.length){if(sl.some(t=>t.r>10)||!part([c.r,...sl.map(t=>t.r)]))return 'مجموع کارت‌ها باید ۱۱ شود';cap=sl}
  if(!cap&&canCap(c,G.table))return 'با این کارت می‌توانی برداری؛ باید کارت‌های زمین را انتخاب کنی و نمی‌شود فقط آن را بیندازی';
  h.splice(ci,1);
  const t=G.team[s],nm=G.names[s];
  if(cap){
    G.table=G.table.filter(x=>!cap.includes(x));G.cap[t].push(c,...cap);G.last=t;
    const more=G.deck.length||G.hands.some(x=>x.length);
    const sr=!G.table.length&&c.r!=11&&more;G.ev={id:(G.evn=(G.evn||0)+1),seat:s,card:c,cap:cap.map(x=>x),sur:sr};if(sr){G.sur[t]++;G.msg=nm+' پاسور کرد! ✨'}else G.msg=nm+' '+cap.length+' کارت برد'
  }else{G.table.push(c);G.ev={id:(G.evn=(G.evn||0)+1),seat:s,card:c,cap:null};G.msg=nm+' یک کارت روی زمین گذاشت'}
  if(!G.hands.some(x=>x.length)){if(G.deck.length)deal();else return finish()}
  do{s=(s+1)%4}while(!G.act.includes(s));G.turn=s;sendAll();return '';
}
function finish(){
  G.cap[G.last].push(...G.table);G.table=[];
  const p=[0,0];
  for(let t=0;t<2;t++){p[t]=G.sur[t]*5;G.cap[t].forEach(c=>{if(c.r==1||c.r==11)p[t]++;if(c.r==10&&c.s=='D')p[t]+=3;if(c.r==2&&c.s=='C')p[t]+=2})}
  const cl=G.cap.map(a=>a.filter(c=>c.s=='C').length);
  if(cl[0]>=7)p[0]+=7;else if(cl[1]>=7)p[1]+=7;
  if(G.cap[0].length>26)p[0]+=3;else if(G.cap[1].length>26)p[1]+=3;
  if(G.target){G.total[0]+=p[0];G.total[1]+=p[1]}G.over=!!G.target&&(G.total[0]>=G.target||G.total[1]>=G.target)&&G.total[0]!=G.total[1];
  G.res={p,cards:G.cap.map(a=>a.length),sur:G.sur,over:G.over};G.phase='end';G.msg='';sendAll();return '';
}

let bt;
function botPlay(){
  if(G.phase!='play'||!G.bots[G.turn])return;
  const s=G.turn,h=G.hands[s],T=G.table;let best=null,bs=-1e9;
  h.forEach((c,ci)=>{
    const opts=[[]];
    if(c.r<11){const ix=T.map((t,i)=>i).filter(i=>T[i].r<=10);for(let m=1;m<1<<ix.length;m++){const x=ix.filter((_,k)=>m>>k&1);if(part([c.r,...x.map(i=>T[i].r)]))opts.push(x)}}
    else if(c.r>11)T.forEach((t,i)=>{if(t.r==c.r)opts.push([i])});
    if(c.r!=11&&opts.length>1)opts.shift();
    opts.forEach(x=>{
      const cap=c.r==11?T.filter(t=>t.r<12):x.map(i=>T[i]);let sc;
      if(cap.length){sc=10+cap.length*2+cap.filter(t=>t.s=='C').length+cap.filter(t=>t.r==1).length+cap.filter(t=>t.r==10&&t.s=='D').length*6+cap.filter(t=>t.r==2&&t.s=='C').length*4+Math.random();if(c.r==11&&cap.length<3)sc-=8}
      else sc=-c.r*.5-(c.r==11?20:0)-(c.r==10&&c.s=='D'?30:0)-(c.r==2&&c.s=='C'?20:0)+Math.random();
      if(sc>bs){bs=sc;best=[ci,x]}
    });
  });
  if(doPlay(s,best[0],best[1]))doPlay(s,0,[]);
}

/* ---------- رابط کاربری ---------- */
function cardEl(c,cls,fn){const d=document.createElement('div');d.className='c '+(c.s=='H'||c.s=='D'?'red ':'')+(cls||'');d.innerHTML='<b>'+RL(c.r)+'</b><i>'+SU[c.s]+'</i>';if(fn)d.onclick=fn;return d}
function render(){
  $('home').hidden=!!V;$('app').hidden=!V;if(!V)return;
  $('rc').textContent=room;setCO(!!V.chatOff);const b=$('main');b.innerHTML='';
  V.phase=='lobby'?lobby(b):board(b);
}
function team(i){return i%2?'تیم ۲':'تیم ۱'}
function lobby(b){
  let h='<div class="box"><b>صندلی‌ها</b>'+(isHost?'<div>🎯 امتیاز هدف: <input id="tg" type="number" inputmode="numeric" min="0" max="999" value="'+(V.target||'')+'" placeholder="خالی = هر دست جدا" onchange="setTarget(this.value)" style="width:170px;display:inline-block"></div>':'<div>🎯 '+(V.target?'بازی تا '+V.target+' امتیاز':'هر دست جدا حساب می‌شود')+'</div>')+'<div style="font-size:13px;opacity:.8">هم‌تیمی‌ها روبه‌روی هم می‌نشینند: صندلی ۱ و ۳ یک تیم، صندلی ۲ و ۴ تیم دیگر.</div>';
  for(let i=0;i<4;i++){
    const n=V.names[i];
    h+='<div class="seat"><span>صندلی '+(i+1)+' ('+team(i)+')</span>'+(n?'<b>'+n+(i==V.me?' (شما)':'')+'</b>':(!isHost&&i>0?'<button onclick="sit('+i+')">اینجا می‌نشینم</button>':'<span style="opacity:.5">خالی</span>'))+'</div>';
  }
  h+='</div>';
  if(isHost)h+='<div class="act" style="display:grid;gap:8px"><button onclick="startGame(4)">شروع ۴ نفره (جای خالی = ربات)</button><button class="g" onclick="startGame(2)" '+(V.names.filter(x=>x).length==2?'':'disabled')+'>شروع دو نفره (بدون ربات)</button><div style="font-size:13px;opacity:.8">حالت دو نفره وقتی فعال می‌شود که دقیقاً دو نفر نشسته باشند.</div></div>';
  else h+='<div class="msg">منتظر شروع بازی توسط میزبان…</div>';
  b.innerHTML=h;
}
function setTarget(v){if(G.phase!='lobby')return;G.target=Math.max(0,Math.min(999,parseInt(v)||0));sendAll()}
function sit(i){host.send({t:'sit',seat:i,name:myName})}
function board(b){
  const my=V.me<0?0:V.me,n=k=>(my+k)%4,tm=V.tm[my];
  const two=V.act.length==2,op=V.act.find(x=>x!=my),ev=V.ev,fresh=!!ev&&ev.id!=lastEv;
  const mini=c=>'<span class="mc'+(c.s=='H'||c.s=='D'?' red':'')+'">'+RL(c.r)+SU[c.s]+'</span>';
  const lm=e=>e?'<div class="lm">'+V.names[e.seat]+': '+mini(e.card)+(e.cap?' ⟵ '+e.cap.map(mini).join(' ')+(e.sur?' ✨ پاسور':''):' ⬇ روی زمین')+'</div>':'';
  const dir=x=>x==my?[0,70]:two?[0,-70]:[[0,70],[-120,0],[0,-70],[120,0]][(x-my+4)%4];
  const ps=x=>V.act.includes(x)?'<div class="p '+(V.turn==x?'on':'')+'">'+V.names[x]+(V.tm[x]==tm&&x!=my?' (هم‌تیمی)':'')+'<br>🂠 '+V.cnt[x]+'</div>':'';
  if(V.phase=='end'){
    const mem=t=>V.act.filter(x=>V.tm[x]==t).map(x=>V.names[x]).join(' و '),nm=t=>V.act.length==2?mem(t):team(t)+' ('+mem(t)+')';
    const r=V.res,w=V.target?(r.over?nm(V.total[0]>V.total[1]?0:1)+' برنده‌ی کل بازی شد 🏆':'دست تمام شد'):(r.p[0]==r.p[1]?'مساوی':nm(r.p[0]>r.p[1]?0:1)+' برنده شد 🏆');
    b.innerHTML='<div class="box res"><b style="font-size:24px">'+w+'</b>'+[0,1].map(t=>'<div>'+nm(t)+': <b>'+r.p[t]+'</b> امتیاز'+(V.target?' — جمع کل: <b>'+V.total[t]+'</b> از '+V.target:'')+'<br><small>'+r.cards[t]+' کارت، '+r.sur[t]+' پاسور</small></div>').join('')+'</div>'+(isHost?'<div class="act"><button onclick="startGame(G.mode)">'+(r.over?'بازی جدید':(V.target?'دست بعدی':'دست جدید'))+'</button></div>':'');
    return;
  }
  b.innerHTML='<div class="bar box" style="padding:8px 14px"><span>ما: '+(V.target?V.total[tm]+' امتیاز | ':'')+V.cc[tm]+' کارت، '+V.sur[tm]+' پاسور</span><span>حریف: '+(V.target?V.total[1-tm]+' امتیاز | ':'')+V.cc[1-tm]+' کارت، '+V.sur[1-tm]+' پاسور</span></div>'
   +'<div class="top">'+ps(two?op:n(2))+'</div><div class="mid">'+(two?'':ps(n(3)))+'<div class="tb" id="tb"></div>'+(two?'':ps(n(1)))+'</div>'
   +'<div class="msg">'+V.msg+'</div><div class="hand" id="hd"></div><div class="act"><button id="go"></button></div>';
  V.table.forEach((c,i)=>$('tb').append(cardEl(c,(sel.includes(i)?'sel':'')+(fresh&&!ev.cap&&i==V.table.length-1?' new':''),()=>{if(pc<0)return;sel=sel.includes(i)?sel.filter(x=>x!=i):[...sel,i];render()})));
  if(fresh&&ev.cap){const g=document.createElement('div'),d=dir(ev.seat);g.className='gh';g.style.setProperty('--dx',d[0]+'px');g.style.setProperty('--dy',d[1]+'px');[ev.card,...ev.cap].forEach(c=>g.append(cardEl(c)));$('tb').append(g)}
  if(ev)lastEv=ev.id;
  V.hand.forEach((c,i)=>$('hd').append(cardEl(c,pc==i?'sel':'',()=>{pc=pc==i?-1:i;sel=[];render()})));
  const g=$('go'),mine=V.turn==V.me;
  const isJ=pc>=0&&V.hand[pc].r==11;
  g.disabled=!mine||pc<0;
  g.textContent=!mine?'نوبت '+V.names[V.turn]:pc<0?'یک کارت انتخاب کن':isJ?'سرباز بزن':sel.length?'بردار':'روی زمین بگذار';
  g.onclick=()=>{const ci=pc,s=sel;pc=-1;sel=[];if(isHost){const e=doPlay(0,ci,s);if(e){alert(e);render()}}else host.send({t:'play',ci,sel:s})};
}
</script>
